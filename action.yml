name: "Nemotron-Healer Autonomous Self-Healing CI"
description: "Zero-dependency autonomous code self-healing action powered by NVIDIA Nemotron on Nebius Token Factory & Tavily Search"
author: "kujiu27"
inputs:
  command:
    description: "The test command to execute and verify (e.g. 'pytest', 'go test ./...')"
    required: true
  path:
    description: "Working directory to heal, relative to the repo root (e.g. a failing sample or sub-project)"
    required: false
    default: "."
  turns:
    description: "Maximum self-healing attempts"
    required: false
    default: "5"
  enable_arena:
    description: "Enable Red-Blue Adversarial Self-Play Arena"
    required: false
    default: "true"
  enable_search:
    description: "Enable Test-Time Compute (TTC) Divergent Hypothesis Search"
    required: false
    default: "false"
  enable_mock:
    description: "Run in offline mock mode using built-in labeled mock server (zero API keys required)"
    required: false
    default: "false"
  sarif:
    description: "Export diagnostic and healing results in standard SARIF 2.1.0 format to path"
    required: false
    default: ""
  github_token:
    description: "GitHub token for creating PR comments"
    required: false
    default: ${{ github.token }}
outputs:
  is_resolved:
    description: "Whether the issue was autonomously resolved and verified"
    value: ${{ steps.heal.outputs.is_resolved }}
  branch_name:
    description: "Git branch containing the verified fix commit and audit card"
    value: ${{ steps.heal.outputs.branch_name }}
  turns_used:
    description: "Number of healing turns attempted"
    value: ${{ steps.heal.outputs.turns_used }}
  patch_digest:
    description: "SHA-256 cryptographic provenance digest of the verified patch"
    value: ${{ steps.heal.outputs.patch_digest }}
  defect_archetype:
    description: "Classified defect archetype"
    value: ${{ steps.heal.outputs.defect_archetype }}
  duration_seconds:
    description: "Total self-healing runtime in seconds"
    value: ${{ steps.heal.outputs.duration_seconds }}

runs:
  using: "composite"
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'
        check-latest: true

    - name: Build Nemotron-Healer from source
      shell: bash
      run: |
        if [ -d "$GITHUB_ACTION_PATH/cmd/nemotron-healer" ]; then
          echo "Building Nemotron-Healer directly from action path: $GITHUB_ACTION_PATH..."
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /usr/local/bin/nemotron-healer "$GITHUB_ACTION_PATH/cmd/nemotron-healer"
        else
          REF="${{ github.action_ref }}"
          if [ -z "$REF" ]; then REF="main"; fi
          echo "Building Nemotron-Healer from source @ ${REF}..."
          git clone --depth 1 --branch "${REF}" https://github.com/kujiu27/nemotron-healer-go.git /tmp/nh-src \
            || git clone --depth 1 https://github.com/kujiu27/nemotron-healer-go.git /tmp/nh-src
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /usr/local/bin/nemotron-healer /tmp/nh-src/cmd/nemotron-healer
        fi
        nemotron-healer version

    - name: Run Autonomous Self-Healing Pipeline
      id: heal
      shell: bash
      env:
        # Inputs are passed via env, never interpolated into the script body:
        # callers deriving inputs from untrusted events (e.g. comment bodies)
        # must not get script injection.
        NH_PATH: ${{ inputs.path }}
        NH_COMMAND: ${{ inputs.command }}
        NH_TURNS: ${{ inputs.turns }}
        NH_ARENA: ${{ inputs.enable_arena }}
        NH_SEARCH: ${{ inputs.enable_search }}
        NH_MOCK: ${{ inputs.enable_mock }}
        NH_SARIF: ${{ inputs.sarif }}
      run: |
        EXTRA_FLAGS=""
        if [[ "$NH_ARENA" == "true" ]]; then
          EXTRA_FLAGS="$EXTRA_FLAGS --arena"
        fi
        if [[ "$NH_SEARCH" == "true" ]]; then
          EXTRA_FLAGS="$EXTRA_FLAGS --search"
        fi
        if [[ "$NH_MOCK" == "true" ]]; then
          EXTRA_FLAGS="$EXTRA_FLAGS --mock"
        fi
        if [[ -n "$NH_SARIF" ]]; then
          EXTRA_FLAGS="$EXTRA_FLAGS --sarif $NH_SARIF"
        fi
        nemotron-healer "$NH_PATH" --command "$NH_COMMAND" --turns "$NH_TURNS" $EXTRA_FLAGS --no-tui

    - name: Publish PR Audit Report Comment
      if: always() && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        REPORT_FILE="HEAL_AUDIT_REPORT.md"
        if [[ ! -f "$REPORT_FILE" && -f "$NH_PATH/HEAL_AUDIT_REPORT.md" ]]; then
          REPORT_FILE="$NH_PATH/HEAL_AUDIT_REPORT.md"
        fi
        if [[ -f "$REPORT_FILE" ]]; then
          gh pr comment ${{ github.event.pull_request.number }} --body-file "$REPORT_FILE" || true
        fi

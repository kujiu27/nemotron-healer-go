name: CI & Cross-Platform Release Matrix

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Build & Race Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Run Unit Tests with Race Detector
        run: go test -v -race ./...

      - name: Compile Cross-Platform Binaries
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/nemotron-healer_linux_amd64 ./cmd/nemotron-healer
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/nemotron-healer_darwin_arm64 ./cmd/nemotron-healer
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/nemotron-healer_darwin_amd64 ./cmd/nemotron-healer
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/nemotron-healer_windows_amd64.exe ./cmd/nemotron-healer
          ls -lh dist/

  release:
    name: Publish Release (tag pushes)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build all platform binaries
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          CGO_ENABLED=0 GOOS=linux  GOARCH=amd64 go build -trimpath -ldflags="-s -w -X github.com/kujiu27/nemotron-healer-go/internal/cli.Version=${VERSION}" -o dist/nemotron-healer_linux_amd64       ./cmd/nemotron-healer
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags="-s -w -X github.com/kujiu27/nemotron-healer-go/internal/cli.Version=${VERSION}" -o dist/nemotron-healer_darwin_arm64     ./cmd/nemotron-healer
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build -trimpath -ldflags="-s -w -X github.com/kujiu27/nemotron-healer-go/internal/cli.Version=${VERSION}" -o dist/nemotron-healer_darwin_amd64     ./cmd/nemotron-healer
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -X github.com/kujiu27/nemotron-healer-go/internal/cli.Version=${VERSION}" -o dist/nemotron-healer_windows_amd64.exe ./cmd/nemotron-healer
          ls -lh dist/

      - name: Create GitHub Release and upload binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes

  action-smoke:
    name: Composite Action Smoke (real runner)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Runs THIS composite action end-to-end: setup-go, source build,
      # heal invocation against the AHB-06 failing sample. CI has no API
      # keys, so the honest outcome is a non-zero exit after the red test
      # reproduces — which proves the whole distribution chain works
      # (install, build, run, report) on a real GitHub runner.
      - name: Run composite action against AHB-06 (expect honest keyless failure)
        id: act
        continue-on-error: true
        uses: ./
        with:
          path: samples/external_go_diff
          command: go test ./diffmatchpatch/ -run TestDiffLinesToChars
          turns: '1'
          enable_arena: 'false'

      - name: Assert action ran and failed honestly (no API key in CI)
        if: steps.act.outcome != 'failure'
        run: |
          echo "Expected the healer to exit non-zero without API keys, got: ${{ steps.act.outcome }}"
          exit 1

      # Positive smoke test: runs composite action with enable_mock: 'true' against AHB-08 (samples/external_gjson),
      # asserting that the GitHub Action successfully heals the bug, verifies falsification,
      # creates the PR branch, and outputs the notice on a real GitHub runner without API keys!
      - name: Run composite action with enable_mock (verify end-to-end success in CI)
        id: act_success
        uses: ./
        with:
          path: samples/external_gjson
          command: go test . -run TestEmptyValueQuery -count=1
          turns: '2'
          enable_mock: 'true'

      - name: Assert action succeeded end-to-end on real runner and populated step outputs
        if: steps.act_success.outcome != 'success' || steps.act_success.outputs.is_resolved != 'true'
        run: |
          echo "Outcome: ${{ steps.act_success.outcome }}"
          echo "Resolved: ${{ steps.act_success.outputs.is_resolved }}"
          echo "Branch: ${{ steps.act_success.outputs.branch_name }}"
          echo "Digest: ${{ steps.act_success.outputs.patch_digest }}"
          if [ "${{ steps.act_success.outputs.is_resolved }}" != "true" ]; then
            echo "Action did not export is_resolved=true output"
            exit 1
          fi
          if [ -z "${{ steps.act_success.outputs.branch_name }}" ]; then
            echo "Action did not export branch_name output"
            exit 1
          fi
          if [ -z "${{ steps.act_success.outputs.patch_digest }}" ]; then
            echo "Action did not export patch_digest output"
            exit 1
          fi

  benchmark-red:
    name: Benchmark RED-State Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps (pytest, pydantic)
        run: python3 -m pip install --quiet pytest pydantic

      - name: Doc link integrity (receipts must exist)
        run: python3 scripts/check_links.py

      - name: Verify AHB-01..06 ship RED (no leaked answers)
        run: |
          RC=0; bash -x scripts/verify_red.sh --skip AHB-07 2>/tmp/vr.err || RC=$?
          cat docs/BENCHMARK_RED_MATRIX.md 2>/dev/null >> "$GITHUB_STEP_SUMMARY"
          exit $RC

      # The go-toml hang case gets its own step: hosted runners tear down the
      # whole step process group when the infinite-recursion buggy tree runs,
      # so we run it isolated and treat ANY non-zero outcome (including the
      # teardown itself) as the required RED state. A fixed/green tree exits 0
      # quickly and fails this check.
      - name: Verify AHB-07 ships RED (hang case, isolated)
        id: a7
        continue-on-error: true
        env:
          GOMEMLIMIT: 256MiB
        run: |
          tmp=$(mktemp -d)
          cp -R samples/external_go_toml/. "$tmp/"
          cd "$tmp"
          ulimit -t 30
          go test . -run TestUnmarshalRecursiveEmbedded -count=1 -timeout 20s

      - name: Assert AHB-07 was RED
        if: steps.a7.outcome != 'failure'
        run: |
          echo "AHB-07 unexpectedly GREEN (outcome=${{ steps.a7.outcome }}) — answer leaked into the sample?"
          exit 1

  mock-pipeline:
    name: Mock Pipeline (full heal loop, no API keys)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      # Locks the full heal loop (reproduce -> triage -> ground -> synthesize
      # -> apply -> pre-flight -> verify -> falsify -> commit) against labeled
      # mock endpoints. If any pipeline stage regresses, this goes red before
      # a judge ever runs the real thing.
      - name: Run make eval-mock
        run: make eval-mock

  vulncheck:
    name: govulncheck (called-path CVEs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      # Round-29 lesson: the pinned toolchain (go 1.26.5) carried 13 stdlib
      # CVEs on called paths (net/http, crypto/tls, mime, asn1). This gate
      # fails the build whenever a called dependency or the toolchain floor
      # regresses against the Go vuln DB.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          $(go env GOPATH)/bin/govulncheck ./...
